[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "argus"
version = "0.1.0"
description = "Codex-first decision-and-invention engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
argus = "argus.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "ruff>=0.12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/argus"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
